<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>etos Mushroom Test</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fdf1dc;
  display: flex;
  justify-content: center;
  align-items: center;
}

.scene {
  position: relative;
  width: min(100%, 1000px);
  aspect-ratio: 1391 / 1131;
  overflow: hidden;
}

.layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
}

/* 黄色キノコ */
.yellow {
  transform-origin: 14% 72%;
  animation: yellowMove 3.2s ease-in-out infinite;
}

/* 緑キノコ */
.green {
  transform-origin: 28% 69%;
  animation: greenMove 3.8s ease-in-out infinite;
}

/* 小さい赤キノコ */
.small-red {
  transform-origin: 44% 73%;
  animation: smallRedMove 3.4s ease-in-out infinite;
}

/* 大きい赤キノコ */
.large-red {
  animation: largeRedMove 4.8s ease-in-out infinite;
}

/* 青キノコ */
.blue {
  transform-origin: 86% 73%;
  animation: blueMove 3.6s ease-in-out infinite;
}

/* 草 */
.grass {
  animation: grassMove 5s ease-in-out infinite;
}

@keyframes yellowMove {
  0%, 100% {
    transform: translateY(0) rotate(0);
  }
  50% {
    transform: translateY(-3px) rotate(-0.7deg);
  }
}

@keyframes greenMove {
  0%, 100% {
    transform: translateY(0) rotate(0);
  }
  50% {
    transform: translateY(-3px) rotate(0.6deg);
  }
}

@keyframes smallRedMove {
  0%, 100% {
    transform: translateY(0) rotate(0);
  }
  50% {
    transform: translateY(-2px) rotate(-0.6deg);
  }
}

@keyframes largeRedMove {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-2px);
  }
}

@keyframes blueMove {
  0%, 100% {
    transform: translateY(0) rotate(0);
  }
  50% {
    transform: translateY(-3px) rotate(0.6deg);
  }
}

@keyframes grassMove {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-1.5px);
  }
}
</style>
</head>

<body>
<main class="scene">

  <img class="layer"
       src="./background_cream.png" alt="">

  <img class="layer yellow"
       src="./mushroom_yellow.png" alt="">

  <img class="layer green"
       src="./mushroom_green.png" alt="">

  <img class="layer small-red"
       src="./mushroom_small_red.png" alt="">

  <img class="layer large-red"
       src="./mushroom_large_red.png" alt="">

  <img class="layer blue"
       src="./mushroom_blue.png" alt="">

  <img class="layer grass"
       src="./grass_foreground.png" alt="">

</main>
</body>
</html>

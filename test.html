<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>etos Mushroom Test</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #fdf1dc;
  display: flex;
  justify-content: center;
  align-items: center;
}

.scene {
  position: relative;
  width: min(100%, 1000px);
  aspect-ratio: 1391 / 1131;
  overflow: hidden;
}

.layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
}

.yellow {
  transform-origin: 14% 72%;
  animation: yellowMove 3.2s ease-in-out infinite;
}

.green {
  transform-origin: 28% 69%;
  animation: greenMove 3.8s ease-in-out infinite;
}

.small-red {
  transform-origin: 44% 73%;
  animation: smallRedMove 3.4s ease-in-out infinite;
}

.large-red {
  animation: largeRedMove 4.8s ease-in-out infinite;
}

.blue {
  transform-origin: 86% 73%;
  animation: blueMove 3.6s ease-in-out infinite;
}

.grass {
  width: 115%;
  left: -7.5%;
  animation: grassMove 3.8s ease-in-out infinite;
}
.soil-ground {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 69%;
  object-fit: fill;
  pointer-events: none;
}
  .story-button {
  position: absolute;
  width: 72%;
  height: auto;
  left: 14%;
  bottom: -6%;
  z-index: 10;
  cursor: pointer;
  image-rendering: pixelated;
     appearance: none;
  border: none;
  padding: 0;
  background: transparent;
}
  .story-button img {
  display: block;
  width: 100%;
  height: auto;
}
@keyframes yellowMove {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-3px) rotate(-0.7deg); }
}

@keyframes greenMove {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-8px) rotate(0.8deg); }
}

@keyframes smallRedMove {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-6px) rotate(-0.8deg); }
}

@keyframes largeRedMove {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

@keyframes blueMove {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-7px) rotate(0.8deg); }
}

@keyframes grassMove {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}

@media (prefers-reduced-motion: reduce) {
  .layer { animation: none !important; }
}
.hamburg-boy {
  position: absolute;
  width: 43%;
  left: 45%;
  top: 24%;
  z-index: 5;
animation: hamburgFloat 2.4s ease-in-out infinite;
animation-delay: -0.4s;
}

.hb-body {
  display: block;
  width: 100%;
  height: auto;
}

.hb-arm {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: auto;
  pointer-events: none;
}

.hb-left {
transform-origin: 43% 58%;
translate: -12% -6%;
animation: knifeWave 2.8s ease-in-out infinite;  
}

.hb-right {
transform-origin: 57% 58%;
animation: forkWave 2.8s ease-in-out infinite;
}
@keyframes hamburgFloat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-12px);
  }
}  
@keyframes knifeWave {
  0%, 100% {
    rotate: 0deg;
  }
  50% {
    rotate: -7deg;
  }
}
@keyframes forkWave {
  0%, 100% {
    rotate: 0deg;
  }
  50% {
    rotate: 12deg;
  }
}
/* Pixel Sky Decorations */
.sky-cloud {
  position: absolute;
  height: auto;
  pointer-events: none;
  z-index: 3;
  image-rendering: pixelated;
}

.cloud-large {
  top: 29%;
  left: 2%;
  width: 29%;
}

.cloud-medium {
  top: 17%;
  left: 60%;
  width: 20%;
}

.cloud-small {
  top: 39%;
  left: 38%;
  width: 13%;
}

.sky-sun {
  position: absolute;
  top: 14%;
  left: 81%;
  width: 15%;
  height: auto;
  z-index: 6;
  pointer-events: none;
  image-rendering: pixelated;
}
  .title-logo {
  position: absolute;
  top: 4%;
  left: 43%;
  transform: translateX(-50%);
  width: 64%;
  height: auto;
  z-index: 4;
  animation: logoWave 4s ease-in-out infinite, logoShine 3s ease-in-out infinite;
}
  @keyframes logoWave {
  0%, 100% { rotate: 0deg; }
  25% { rotate: 1deg; }
  50% { rotate: 0deg; }
  75% { rotate: -1deg; }
}
  @keyframes logoShine {
  0%, 85%, 100% {
    filter: brightness(1);
  }
  90% {
    filter: brightness(1.8);
  }
  95% {
    filter: brightness(1);
  }
}
  top: 28%;
  left: 76%;
  animation-delay: 0.8s;
}
.sparkle-one {
  top: 12%;
  left: 28%;
}

.sparkle-two {
  top: 28%;
  left: 76%;
  animation-delay: 0.8s;
}
  .sparkle {
  position: absolute;
  display: block;
  z-index: 30;
  width: clamp(24px, 4vw, 44px);
  height: clamp(24px, 4vw, 44px);
  font-size: 0;
  background: #ffdf00;
  clip-path: polygon(
    40% 0, 60% 0,
    60% 32%, 68% 32%,
    68% 40%, 100% 40%,
    100% 60%, 68% 60%,
    68% 68%, 60% 68%,
    60% 100%, 40% 100%,
    40% 68%, 32% 68%,
    32% 60%, 0 60%,
    0 40%, 32% 40%,
    32% 32%, 40% 32%
  );
  filter:
  drop-shadow(3px 0 #21180f)
  drop-shadow(-3px 0 #21180f)
  drop-shadow(0 3px #21180f)
  drop-shadow(0 -3px #21180f);
  pointer-events: none;
  animation: sparkleFlash 2.4s ease-in-out infinite;
}
.sparkle-three {
  top: 38%;
  left: 20%;
  animation-delay: 1.6s;
}

@keyframes sparkleFlash {
  0%, 100% {
    opacity: 0.15;
    transform: scale(0.5) rotate(0deg);
  }
  50% {
    opacity: 1;
    transform: scale(1.3) rotate(45deg);
  }
}
.sparkle {
  display: none !important;
}
.c1 { left: 12.4%; }
.c2 { left: 32.2%; }
.c3 { left: 52.0%; }
.c4 { left: 71.8%; }

.r1 { top: 30%; }
.r2 { top: 44%; }
.r3 { top: 58%; }
.r4 { top: 72%; }

.back-button {
  padding: 12px 22px;
  border: 3px solid #38291f;
  border-radius: 8px;
  background: #e6c58b;
  color: #38291f;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
}
</style>
</head>

<span class="sparkle sparkle-two">✦</span>
<span class="sparkle sparkle-three">✦</span>

  <img src="./hamburg_boy_right_arm_fork.png" class="hb-arm hb-right" alt="">
</div>
<div class="game-title">The Making of <span>etos</span></div>
</main>

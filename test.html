<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>etos Mushroom Test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #fdf1dc;
  display: flex;
  justify-content: center;
  align-items: center;
}

.scene {
  position: relative;
  width: min(100%, 1000px);
  aspect-ratio: 1391 / 1131;
  overflow: hidden;
}

.layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
}

.yellow {
  transform-origin: 14% 72%;
  animation: yellowMove 3.2s ease-in-out infinite;
}

.green {
  transform-origin: 28% 69%;
  animation: greenMove 3.8s ease-in-out infinite;
}

.small-red {
  transform-origin: 44% 73%;
  animation: smallRedMove 3.4s ease-in-out infinite;
}

.large-red {
  animation: largeRedMove 4.8s ease-in-out infinite;
}

.blue {
  transform-origin: 86% 73%;
  animation: blueMove 3.6s ease-in-out infinite;
}

.grass {
  width: 115%;
  left: -7.5%;
  animation: grassMove 3.8s ease-in-out infinite;
}
.soil-ground {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 69%;
  object-fit: fill;
  pointer-events: none;
}
  .story-button {
  position: absolute;
  width: 72%;
  height: auto;
  left: 14%;
  bottom: -4%;
  z-index: 10;
  cursor: pointer;
  image-rendering: pixelated;
     appearance: none;
  border: none;
  padding: 0;
  background: transparent;
}
  .story-button img {
  display: block;
  width: 100%;
  height: auto;
}
@keyframes yellowMove {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-3px) rotate(-0.7deg); }
}

@keyframes greenMove {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-8px) rotate(0.8deg); }
}

@keyframes smallRedMove {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-6px) rotate(-0.8deg); }
}

@keyframes largeRedMove {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

@keyframes blueMove {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-7px) rotate(0.8deg); }
}

@keyframes grassMove {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}

@media (prefers-reduced-motion: reduce) {
  .layer { animation: none !important; }
}
.hamburg-boy {
  position: absolute;
  width: 43%;
  left: 45%;
  top: 24%;
  z-index: 5;
animation: hamburgFloat 2.4s ease-in-out infinite;
animation-delay: -0.4s;
}

.hb-body {
  display: block;
  width: 100%;
  height: auto;
}

.hb-arm {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: auto;
  pointer-events: none;
}

.hb-left {
transform-origin: 43% 58%;
translate: -12% -6%;
animation: knifeWave 2.8s ease-in-out infinite;  
}

.hb-right {
transform-origin: 57% 58%;
animation: forkWave 2.8s ease-in-out infinite;
}
@keyframes hamburgFloat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-12px);
  }
}  
@keyframes knifeWave {
  0%, 100% {
    rotate: 0deg;
  }
  50% {
    rotate: -7deg;
  }
}
@keyframes forkWave {
  0%, 100% {
    rotate: 0deg;
  }
  50% {
    rotate: 12deg;
  }
}
/* Pixel Sky Decorations */
.sky-cloud {
  position: absolute;
  height: auto;
  pointer-events: none;
  z-index: 3;
  image-rendering: pixelated;
}

.cloud-large {
  top: 29%;
  left: 2%;
  width: 29%;
}

.cloud-medium {
  top: 17%;
  left: 60%;
  width: 20%;
}

.cloud-small {
  top: 39%;
  left: 38%;
  width: 13%;
}

.sky-sun {
  position: absolute;
  top: 14%;
  left: 81%;
  width: 15%;
  height: auto;
  z-index: 6;
  pointer-events: none;
  animation: sunRotate 40s linear infinite;
  image-rendering: pixelated;
}
  @keyframes sunRotate {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
  .title-logo {
  position: absolute;
  top: 4%;
  left: 43%;
  transform: translateX(-50%);
  width: 64%;
  height: auto;
  z-index: 4;
  animation: logoWave 4s ease-in-out infinite, logoShine 3s ease-in-out infinite;
}
  @keyframes logoWave {
  0%, 100% { rotate: 0deg; }
  25% { rotate: 1deg; }
  50% { rotate: 0deg; }
  75% { rotate: -1deg; }
}
  @keyframes logoShine {
  0%, 85%, 100% {
    filter: brightness(1);
  }
  90% {
    filter: brightness(1.8);
  }
  95% {
    filter: brightness(1);
  }
}
  top: 28%;
  left: 76%;
  animation-delay: 0.8s;
}
.sparkle-one {
  top: 12%;
  left: 28%;
}

.sparkle-two {
  top: 28%;
  left: 76%;
  animation-delay: 0.8s;
}
  .sparkle {
  position: absolute;
  display: block;
  z-index: 30;
  width: clamp(24px, 4vw, 44px);
  height: clamp(24px, 4vw, 44px);
  font-size: 0;
  background: #ffdf00;
  clip-path: polygon(
    40% 0, 60% 0,
    60% 32%, 68% 32%,
    68% 40%, 100% 40%,
    100% 60%, 68% 60%,
    68% 68%, 60% 68%,
    60% 100%, 40% 100%,
    40% 68%, 32% 68%,
    32% 60%, 0 60%,
    0 40%, 32% 40%,
    32% 32%, 40% 32%
  );
  filter:
  drop-shadow(3px 0 #21180f)
  drop-shadow(-3px 0 #21180f)
  drop-shadow(0 3px #21180f)
  drop-shadow(0 -3px #21180f);
  pointer-events: none;
  animation: sparkleFlash 2.4s ease-in-out infinite;
}
.sparkle-three {
  top: 38%;
  left: 20%;
  animation-delay: 1.6s;
}

@keyframes sparkleFlash {
  0%, 100% {
    opacity: 0.15;
    transform: scale(0.5) rotate(0deg);
  }
  50% {
    opacity: 1;
    transform: scale(1.3) rotate(45deg);
  }
}
.sparkle {
  display: none !important;
}
.c1 { left: 12.4%; }
.c2 { left: 32.2%; }
.c3 { left: 52.0%; }
.c4 { left: 71.8%; }

.r1 { top: 30%; }
.r2 { top: 44%; }
.r3 { top: 58%; }
.r4 { top: 72%; }

.back-button {
  padding: 12px 22px;
  border: 3px solid #38291f;
  border-radius: 8px;
  background: #e6c58b;
  color: #38291f;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
}
/* Episode links: tap area fix */
#episodeScreen img {

  width: 100%;
  height: auto;
  pointer-events: none;
}

#episodeScreen a {
  display: block;
  position: absolute;
  z-index: 10;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  background: transparent;
}
/* Episode Select Hamburger Boy */
.episode-hamburg-boy {

  width: 23%;
  left: 38.5%;
  top: 10%;
  z-index: 5;
  pointer-events: none;

/* Episode Select Sparkles */
.episode-sparkle {

  z-index: 6;
  color: #ffe45c;
  font-size: 26px;
  animation: episodeSparkle 2s ease-in-out infinite;
  pointer-events: none;
}

.episode-sparkle.one {
  left: 34%;
  top: 17%;
}

.episode-sparkle.two {
  left: 61%;
  top: 20%;
  animation-delay: 0.7s;
}

@keyframes episodeSparkle {
  0%, 100% {
    opacity: 0.3;
    transform: rotate(0deg) scale(0.8);
  }
  50% {
    opacity: 1;
    transform: rotate(180deg) scale(1.2);
  }
}
  .title-footer {
  position: absolute;
  bottom: 1.5%;
  left: 0;
  width: 100%;
  text-align: center;
  color: #fff1d5;
  font-family: "Press Start 2P", monospace;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1px;
  line-height: 1.8;
  text-shadow: 2px 2px #59351f;
  z-index: 20;
  pointer-events: none;
    white-space: nowrap;
}

@media (max-width: 600px) {
  .title-footer {
    font-size: 6px;
    letter-spacing: 0;
  }
}</style>
</head>

<button id="bgmToggle" onclick="toggleBgm()" style="
  position: fixed;
  right: 20px;
  bottom: 105px;
  z-index: 1000;
  width: 52px;
  height: 52px;
  border: 3px solid #e6ac58;
  border-radius: 50%;
  background: #159B9B;
  color: #FFF1D5;
  font-size: 27px;
  cursor: pointer;
">
  ♪
</button>
<script>
const titleBgm = new Audio("./etos-bgm.wav");
const selectBgm = new Audio("./select_bgm.wav");

titleBgm.loop = true;
selectBgm.loop = true;

titleBgm.volume = 0.25;
selectBgm.volume = 0.25;

let bgmEnabled = false;

function playBgm(audio) {
  if (!bgmEnabled) return;

  titleBgm.pause();
  selectBgm.pause();

  audio.currentTime = 0;
  audio.play().catch(error => {
    console.log("BGM playback failed:", error);
  });
}
  function toggleBgm() {
  const button = document.getElementById("bgmToggle");

  bgmEnabled = !bgmEnabled;

  if (bgmEnabled) {
    const isEpisodeScreen =
      document.getElementById("episodeScreen").style.display === "flex";

    playBgm(isEpisodeScreen ? selectBgm : titleBgm);
    button.textContent = "♪";
  } else {
    titleBgm.pause();
    selectBgm.pause();
    button.textContent = "×";
  }
}
  function showEpisodeSelect() {
  if (document.getElementById("screenFade")) return;
const startButtonSe = new Audio("./start_button_se.wav");
startButtonSe.play().catch(() => {});
  const fade = document.createElement("div");
  fade.id = "screenFade";
  fade.style.cssText = `
    position: fixed;
    inset: 0;
    background: black;
    opacity: 0;
    z-index: 99999;
    pointer-events: none;
    transition: opacity 200ms ease;
  `;

  document.body.appendChild(fade);

  requestAnimationFrame(() => {
    fade.style.opacity = "1";
  });

  setTimeout(() => {
    document.getElementById("titleScreen").style.display = "none";
    document.getElementById("episodeScreen").style.display = "flex";
    playBgm(selectBgm);
    window.scrollTo(0, 0);

    fade.style.opacity = "0";

    setTimeout(() => {
      fade.remove();
    }, 200);
  }, 200);
}

function returnToTitle() {
  if (document.getElementById("screenFade")) return;

  const fade = document.createElement("div");
  fade.id = "screenFade";
  fade.style.position = "fixed";
  fade.style.inset = "0";
  fade.style.background = "black";
  fade.style.opacity = "0";
  fade.style.zIndex = "99999";
  fade.style.pointerEvents = "none";
  fade.style.transition = "opacity 200ms ease";

  document.body.appendChild(fade);

  requestAnimationFrame(() => {
    fade.style.opacity = "1";
  });

  setTimeout(() => {
    document.getElementById("episodeScreen").style.display = "none";
    document.getElementById("titleScreen").style.display = "";
    playBgm(titleBgm);
    window.scrollTo(0, 0);

    fade.style.opacity = "0";

    setTimeout(() => {
      fade.remove();
    }, 200);
  }, 200);
}
document.querySelectorAll('#episodeScreen a[href*="instagram.com"]').forEach(link => {
  link.addEventListener("click", () => {
    selectBgm.pause();
    selectBgm.currentTime = 0;
  });
});
function resumeSelectBgm() {
  const episodeScreen = document.getElementById("episodeScreen");

  if (
    !document.hidden &&
    bgmEnabled &&
    episodeScreen.style.display === "flex" &&
    selectBgm.paused
  ) {
    playBgm(selectBgm);
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    titleBgm.pause();
    selectBgm.pause();
  } else {
    resumeSelectBgm();
  }
});

window.addEventListener("pagehide", () => {
  titleBgm.pause();
  selectBgm.pause();
});

window.addEventListener("pageshow", resumeSelectBgm);
</script>

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#173e39">

<title>The Making of etos</title>

<style>

* {

  box-sizing: border-box;

}

html, body {

  margin: 0;

  min-height: 100%;

  background: #173e39;

  font-family: Arial, sans-serif;

}

body {

  display: flex;

  justify-content: center;

  min-height: 100svh;

  padding: 16px 12px 28px;

}

.screen {

  width: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

}

.hidden {

  display: none !important;

}

.artwork {

  display: block;

  width: 100%;

  height: auto;

  user-select: none;

  -webkit-user-drag: none;

}

.title-art {

  width: min(100%, 520px);

}

.start-button {

  margin-top: 18px;

  width: min(90%, 360px);

  min-height: 58px;

  border: 4px solid #38291f;

  border-radius: 12px;

  background: #397b72;

  color: #fff1d0;

  font-size: 21px;

  font-weight: 900;

  letter-spacing: 3px;

  box-shadow: 0 6px 0 #241b17;

  cursor: pointer;

  transition: transform 0.1s, box-shadow 0.1s;

}

.start-button:active {

  transform: translateY(4px);

  box-shadow: 0 2px 0 #241b17;

}

.caption {

  color: #f5e5c4;

  font-size: 11px;

  letter-spacing: 3px;

  margin-top: 16px;

  text-align: center;

}

.episode-wrap {

  position: relative;

  width: min(100%, 760px);

  line-height: 0;

}

.episode-art {

  width: 100%;

  height: auto;

}

.episode-link {

  position: absolute;

  display: block;

  width: 18.8%;

  height: 13.1%;

  border-radius: 13%;

  background: transparent;

  border: 0;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

}

.episode-link:focus-visible {

  outline: 4px solid #fff2a8;

  outline-offset: 2px;

}

.c1 { left: 12.4%; }

.c2 { left: 32.2%; }

.c3 { left: 52.0%; }

.c4 { left: 71.8%; }

.r1 { top: 30.0%; }

.r2 { top: 44.0%; }

.r3 { top: 58.0%; }

.r4 { top: 72.0%; }

.back-button {

  margin-top: 18px;

  padding: 12px 22px;

  border: 3px solid #38291f;

  border-radius: 8px;

  background: #e6c58b;

  color: #38291f;

  font-weight: bold;

  font-size: 14px;

  cursor: pointer;

}

@media (max-width: 480px) {

  body {

    padding: 8px 5px 20px;

  }

  .start-button {

    min-height: 54px;

    font-size: 18px;

  }

  .caption {

    font-size: 9px;

  }

  .episode-link {

    height: 13.1%;

  }

}

</style>

</head>

<body>

<script>

const titleScreen = document.getElementById("titleScreen");

const episodeScreen = document.getElementById("episodeScreen");

document.getElementById("startButton").addEventListener("click", () => {

  titleScreen.style.transition = "opacity 0.3s ease";

  titleScreen.style.opacity = "0";

  setTimeout(() => {

    titleScreen.classList.add("hidden");

    titleScreen.style.opacity = "1";

    episodeScreen.classList.remove("hidden");

    window.scrollTo(0, 0);

  }, 300);

});

document.getElementById("backButton").addEventListener("click", () => {

  episodeScreen.classList.add("hidden");

  titleScreen.classList.remove("hidden");

  window.scrollTo(0, 0);

});

</script>

<style>
/* Hamburg Boy floating animation */

.hamburg-boy {

  animation: hamburgFloat 2.4s ease-in-out infinite;

  transform-origin: center center;

}

@keyframes hamburgFloat {

  0%, 100% {

    transform: translateY(0);

  }

  50% {

    transform: translateY(-12px);

  }

}
* {

  box-sizing: border-box;

}

html, body {

  margin: 0;

  min-height: 100%;

  background: #173e39;

  font-family: Arial, sans-serif;

}

body {

  justify-content: center;

  min-height: 100svh;

  padding: 16px 12px 28px;

}

.screen {

  width: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

}

.hidden {

  display: none !important;

}

.artwork {

  display: block;

  width: 100%;

  height: auto;

  user-select: none;

  -webkit-user-drag: none;

}

.title-art {

  width: min(100%, 520px);

}

.start-button {

  margin-top: 18px;

  width: min(90%, 360px);

  min-height: 58px;

  border: 4px solid #38291f;

  border-radius: 12px;

  background: #397b72;

  color: #fff1d0;

  font-size: 21px;

  font-weight: 900;

  letter-spacing: 3px;

  box-shadow: 0 6px 0 #241b17;

  cursor: pointer;

  transition: transform 0.1s, box-shadow 0.1s;

}

.start-button:active {

  transform: translateY(4px);

  box-shadow: 0 2px 0 #241b17;

}
.title-art-wrap {

  position: relative;

  width: min(100%, 520px);

}

.title-art-wrap .title-art {

  display: block;

  width: 100%;

}
.hamburg-boy {

  position: absolute;

  width: 48%;

  left: 43%;

  top: -5%;

  height: auto;

  z-index: 3;

  pointer-events: none;

  animation: boyFloat 2.4s ease-in-out infinite;

}

@keyframes boyFloat {

  0%, 100% {

    transform: translateY(0);

  }

  50% {

    transform: translateY(-8px);

  }

}

.artwork-link {

  position: absolute;

  left: 3%;

  bottom: 2%;

  width: 94%;

  height: 10%;

  border: none;

  background: transparent;

  cursor: pointer;

  z-index: 5;

}

.caption {

  color: #f5e5c4;

  font-size: 11px;

  letter-spacing: 3px;

  margin-top: 16px;

  text-align: center;

}

.episode-wrap {

  position: relative;

  width: min(100%, 760px);

  line-height: 0;

}

.episode-art {

  width: 100%;

  height: auto;

}

.episode-link {

  position: absolute;

  display: block;

  width: 18.8%;

  height: 13.1%;

  border-radius: 13%;

  background: transparent;

  border: 0;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

}
.episode-link {

  transition: transform 0.12s ease, box-shadow 0.12s ease;

}

.episode-link:active {

  transform: scale(1.04);

  border-radius: 13%;

  box-shadow:

    0 0 8px 4px #ffe45c,

    0 0 20px 8px rgba(255, 220, 50, 0.85),

    inset 0 0 0 3px #ffe45c;

}

.episode-link:focus-visible {

  outline: 4px solid #fff2a8;

  outline-offset: 2px;

}

.c1 { left: 12.4%; }

.c2 { left: 32.2%; }

.c3 { left: 52.0%; }

.c4 { left: 71.8%; }

.r1 { top: 30.0%; }

.r2 { top: 44.0%; }

.r3 { top: 58.0%; }

.r4 { top: 72.0%; }

.back-button {

  margin-top: 18px;

  padding: 12px 22px;

  border: 3px solid #38291f;

  border-radius: 8px;

  background: #e6c58b;

  color: #38291f;

  font-weight: bold;

  font-size: 14px;

  cursor: pointer;

}

@media (max-width: 480px) {

  body {

    padding: 8px 5px 20px;

  }

  .start-button {

    min-height: 54px;

    font-size: 18px;

  }

  .caption {

    font-size: 9px;

  }

  .episode-link {

    height: 13.1%;

  }

}
/* Hamburg Boy body */

.hamburg-boy {

position: absolute;
  animation: boyFloat 2.4s ease-in-out infinite;

}

.hb-body {

  display: block;

  width: 100%;

  height: auto;

  position: relative;

  z-index: 3;

}

/* Arms */

.hb-arm {

  position: absolute;

  width: 100%;

  height: auto;

  top: 0;

  left: 0;

  z-index: 4;

  pointer-events: none;

}

.hb-left {
left: -11%;
  top: -9%;
  transform-origin: 40% 80%;

  animation: knifeWave 2.8s ease-in-out infinite;

}

.hb-right {

  transform-origin: 57% 58%;

  animation: forkWave 2.8s ease-in-out infinite;

}

@keyframes knifeWave {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-7deg); }
}
@keyframes forkWave {

  0%, 100% { transform: rotate(0deg); }

  50% { transform: rotate(12deg); }

}

</style>

<script>

const titleScreen = document.getElementById("titleScreen");

const episodeScreen = document.getElementById("episodeScreen");

document.getElementById("startButton").addEventListener("click", () => {

  titleScreen.style.transition = "opacity 0.3s ease";

  titleScreen.style.opacity = "0";

  setTimeout(() => {

    titleScreen.classList.add("hidden");

    titleScreen.style.opacity = "1";

    episodeScreen.classList.remove("hidden");

    window.scrollTo(0, 0);

  }, 300);

});

document.getElementById("backButton").addEventListener("click", () => {

  episodeScreen.classList.add("hidden");

  titleScreen.classList.remove("hidden");

  window.scrollTo(0, 0);

});

</script>

<audio id="etosBGM" src="etos-bgm.wav" loop preload="auto"></audio>



<script>

const bgm = document.getElementById("etosBGM");

const soundButton = document.getElementById("soundButton");

let soundStarted = false;

async function startBGM() {

  if (soundStarted) return;

  try {

    bgm.volume = 0.25;

    await bgm.play();

    soundStarted = true;

    soundButton.textContent = "♪ SOUND ON";

  } catch (error) {

    console.log("BGM playback requires user interaction.");

  }

}

document.addEventListener("pointerdown", (event) => {

  if (!event.target.closest("#soundButton")) {

    startBGM();

  }

}, { once: true });


soundButton.addEventListener("click", async (event) => {

  event.stopPropagation();

  if (bgm.paused) {

    try {

      bgm.volume = 0.25;

      await bgm.play();

      soundStarted = true;

      soundButton.textContent = "♪ SOUND ON";

    } catch (error) {

      console.log(error);

    }

  } else {

    bgm.pause();

    soundButton.textContent = "♪ SOUND OFF";

  }

});

document.addEventListener("visibilitychange", () => {

  if (document.hidden) {

    bgm.pause();

    soundButton.textContent = "♪ SOUND OFF";

  }

});

</script>
